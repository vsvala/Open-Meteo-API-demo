name: Deployment pipellline

on:
  push:
    branches:
      - master
jobs:

    simple_deploy_job:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-node@v6
          with:
            node-version: '24'
        - name: Install dependencies
          run: npm install
        - name: Check style
          run: npm run eslint
        - name: Run tests
          run: npm test
        - name: Build
          run: npm run build
